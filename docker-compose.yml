version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: elane-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: elane-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/elane
    ports:
      - '5000:5000'
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: elane-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo-data:
